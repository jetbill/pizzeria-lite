services:
  db:
    image: postgres:14
    container_name: pizzeria-db
    environment:
      POSTGRES_DB: pizzeria_db
      POSTGRES_USER: pizzeria_user
      POSTGRES_PASSWORD: pizzeria_pass123
    ports:
      - "5432:5432"
    volumes:
      - pizzeria_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pizzeria_user -d pizzeria_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: pizzeria-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  pizzeria_pgdata:
