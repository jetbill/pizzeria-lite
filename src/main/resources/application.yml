server:
  port: 8080

spring:
  application:
    name: ${APPLICATION_NAME}

  datasource:
    url: jdbc:postgresql://localhost:5432/${DB}
    #url: jdbc:postgresql://db:5432/pizzeria_db
    username: ${USER}
    password: ${PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    env:
      show-values: always
# API key de un proveedor de notificaciones ficticio, hardcodeada en el archivo de config
notification:
  provider-url: ${API_URL}
  api-key: ${API_KEY}
